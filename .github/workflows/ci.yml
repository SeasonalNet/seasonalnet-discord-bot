name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.17.0") {
            throw new Error(
              `expected packageManager pnpm@11.17.0, got ${pkg.packageManager}`
            );
          }

          if (pkg.engines?.node !== ">=22.12.0") {
            throw new Error(
              `expected Node engine >=22.12.0, got ${pkg.engines?.node}`
            );
          }

          if ("overrides" in pkg || "allowScripts" in pkg) {
            throw new Error(
              "npm-specific dependency policy remains in package.json"
            );
          }

          console.log("package manager:", pkg.packageManager);
          console.log("Node engine:", pkg.engines.node);
          NODE

          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency policy
        run: |
          pnpm ignored-builds
          pnpm peers check
          pnpm list --depth 0
          pnpm list undici --depth Infinity

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import YAML from "yaml";

          const settings = YAML.parse(
            fs.readFileSync("pnpm-workspace.yaml", "utf8")
          );

          if (settings.overrides?.undici !== "6.28.0") {
            throw new Error(
              `unexpected undici override: ${settings.overrides?.undici}`
            );
          }

          if (settings.allowBuilds?.["esbuild@0.28.1"] !== true) {
            throw new Error(
              "esbuild@0.28.1 is not explicitly approved"
            );
          }

          console.log("dependency policy: ok");
          NODE

      - name: Type-check
        run: pnpm check

      - name: Build
        run: |
          rm -rf dist
          pnpm build

          test -f dist/src/index.js

          find dist -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Exercise runtime dependencies
        run: |
          node --input-type=module <<'NODE'
          const discord = await import("discord.js");
          const dotenv = await import("dotenv");
          const yaml = await import("yaml");

          if (typeof discord.Client !== "function") {
            throw new Error("discord.js Client did not load");
          }

          if (typeof dotenv.config !== "function") {
            throw new Error("dotenv config did not load");
          }

          if (typeof yaml.parse !== "function") {
            throw new Error("yaml parser did not load");
          }

          console.log("runtime dependencies: ok");
          NODE

  security:
    uses: ./.github/workflows/security.yml

  publish-container:
    needs: [node, security]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "$repository" | tr '[:upper:]' '[:lower:]')"
          publish() {
            local image="$1" dockerfile="$2" context="$3"
            local tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              tags+=(--tag "$image:latest")
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "$image:$GITHUB_REF_NAME" --tag "$image:latest")
            fi
            docker buildx build --push "${tags[@]}" --file "$dockerfile" "$context"
          }
          publish "ghcr.io/$owner/seasonalnet-discord-bot" "Dockerfile" "."
