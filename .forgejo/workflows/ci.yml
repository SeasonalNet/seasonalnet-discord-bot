name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  node:
    runs-on: node22

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.17.0") {
            throw new Error(
              `expected packageManager pnpm@11.17.0, got ${pkg.packageManager}`
            );
          }

          if (pkg.engines?.node !== ">=22.12.0") {
            throw new Error(
              `expected Node engine >=22.12.0, got ${pkg.engines?.node}`
            );
          }

          if ("overrides" in pkg || "allowScripts" in pkg) {
            throw new Error(
              "npm-specific dependency policy remains in package.json"
            );
          }

          console.log("package manager:", pkg.packageManager);
          console.log("Node engine:", pkg.engines.node);
          NODE

          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test ! -e package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency policy
        run: |
          pnpm ignored-builds
          pnpm peers check
          pnpm list --depth 0
          pnpm list undici --depth Infinity

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import YAML from "yaml";

          const settings = YAML.parse(
            fs.readFileSync("pnpm-workspace.yaml", "utf8")
          );

          console.log("dependency policy: ok");
          NODE

      - name: Type-check
        run: pnpm check

      - name: Build
        run: |
          rm -rf dist
          pnpm build

          test -f dist/src/index.js

          find dist -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Exercise runtime dependencies
        run: |
          node --input-type=module <<'NODE'
          const discord = await import("discord.js");
          const dotenv = await import("dotenv");
          const yaml = await import("yaml");

          if (typeof discord.Client !== "function") {
            throw new Error("discord.js Client did not load");
          }

          if (typeof dotenv.config !== "function") {
            throw new Error("dotenv config did not load");
          }

          if (typeof yaml.parse !== "function") {
            throw new Error("yaml parser did not load");
          }

          console.log("runtime dependencies: ok");
          NODE

  publish-container:
    name: Publish container images
    needs: [node]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [docker, slate-builder]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Docker CLI and Buildx
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          test "$ID" = debian
          printf '%s\n' \
            "Types: deb" \
            "URIs: https://download.docker.com/linux/debian" \
            "Suites: $VERSION_CODENAME" \
            "Components: stable" \
            "Architectures: $(dpkg --print-architecture)" \
            "Signed-By: /etc/apt/keyrings/docker.asc" \
            > /etc/apt/sources.list.d/docker.sources
          apt-get update
          apt-get install --yes --no-install-recommends docker-ce-cli docker-buildx-plugin
          docker version
          docker buildx version
      - name: Trust the SeasonalNet Harbor CA
        run: update-ca-certificates
      - name: Log in to Harbor
        env:
          HARBOR_CI_USERNAME: ${{ secrets.HARBOR_CI_USERNAME }}
          HARBOR_CI_PASSWORD: ${{ secrets.HARBOR_CI_PASSWORD }}
        run: printf '%s' "$HARBOR_CI_PASSWORD" | docker login registry.lan.seasonalnet.org --username "$HARBOR_CI_USERNAME" --password-stdin
      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local image="$1" dockerfile="$2" context="$3"
            local tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              tags+=(--tag "$image:latest")
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "$image:$GITHUB_REF_NAME" --tag "$image:latest")
            fi
            docker buildx build --push "${tags[@]}" --file "$dockerfile" "$context"
          }
          publish "registry.lan.seasonalnet.org/seasonalnet/seasonalnet-discord-bot" "Dockerfile" "."
